# The offline checks, on every push and pull request. None of them needs a model key,
# LiveKit, or Chrome: the checks that do (dev/checks/) are run by hand.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check . ../dev
      - run: uv run ruff format --check . ../dev
      - run: uv run pytest -q
      - run: uv run python -m lecturer.check example/cone

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm test
