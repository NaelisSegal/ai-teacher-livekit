# Local LiveKit dev server for the AI teacher.
# Ports: 4070 signalling, 4071 media (TCP and UDP). The web app is on 4072.
# The key below is the well-known dev key. Never use it on a real server.
port: 4070
rtc:
  tcp_port: 4071
  udp_port: 4071
  use_external_ip: false
keys:
  devkey: secret
logging:
  level: info
